services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stampperk
      POSTGRES_PASSWORD: stampperk
      POSTGRES_DB: stampperk
    ports:
      - "5432:5432"
    volumes:
      - stampperk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stampperk -d stampperk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stampperk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["staging"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://stampperk:stampperk@postgres:5432/stampperk?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: stampperk-staging-jwt-secret-change-in-prod
      JWT_EXPIRES_IN: 7d
      APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["staging"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  stampperk_pg:
  stampperk_redis:
