version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stampperk
      POSTGRES_PASSWORD: stampperk
      POSTGRES_DB: stampperk
    ports:
      - '5432:5432'
    volumes:
      - stampperk_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
volumes:
  stampperk_pg:
