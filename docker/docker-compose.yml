version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stampz
      POSTGRES_PASSWORD: stampz
      POSTGRES_DB: stampz
    ports:
      - '5432:5432'
    volumes:
      - stampz_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
volumes:
  stampz_pg:
