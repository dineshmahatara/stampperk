name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stampperk
          POSTGRES_PASSWORD: stampperk
          POSTGRES_DB: stampperk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stampperk -d stampperk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stampperk:stampperk@localhost:5432/stampperk?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build -w @stampperk/shared
      - run: npm run prisma:generate -w @stampperk/api
      - name: Apply schema
        working-directory: apps/api
        run: npx prisma db push
      - run: npm run build -w @stampperk/api
      - run: npm run build -w @stampperk/web
